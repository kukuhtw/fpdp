<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # Debian's Apache denies any filesystem path with a dot-prefixed
    # directory segment (blocking .git, .env, .htaccess, etc: a
    # DirectoryMatch on "^/.*/\." with Require all denied). /.well-known/
    # is an RFC 5785 directory that ActivityPub's WebFinger endpoint must
    # serve publicly, and a same-kind Directory/DirectoryMatch override
    # here is not reliably guaranteed to out-rank that rule (it depends
    # on exact file-inclusion order, which is not worth pinning down).
    # LocationMatch operates on the request URL rather than the
    # filesystem path and is applied in Apache's LAST authorization
    # merge pass, strictly after every Directory/DirectoryMatch section
    # regardless of which config file set it, so it is guaranteed to win.
    <LocationMatch "^/\.well-known/">
        Require all granted
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
