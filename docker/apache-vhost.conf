<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Debian's Apache ships a security.conf hardening rule that denies any
    # path with a dot-prefixed directory segment via DirectoryMatch
    # (blocking .git, .env, .htaccess, etc: DirectoryMatch "^/.*/\." ->
    # Require all denied). /.well-known/ is an RFC 5785 directory that
    # ActivityPub's WebFinger endpoint must serve publicly. Apache merges
    # plain Directory sections (by path length) BEFORE any
    # DirectoryMatch/regex sections, regardless of file load order, so a
    # plain Directory override here would still lose to security.conf's
    # rule. This must be a DirectoryMatch too, so it merges in the same
    # regex pass and, since this vhost file loads from sites-enabled
    # after conf-enabled/security.conf, wins.
    <DirectoryMatch "^/var/www/html/public/\.well-known">
        Options -Indexes
        AllowOverride None
        Require all granted
    </DirectoryMatch>

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
