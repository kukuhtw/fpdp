# Nginx site for FPDP on Ubuntu (PHP-FPM).
# Install:  sudo cp deploy/ubuntu/nginx-fpdp.conf /etc/nginx/sites-available/fpdp
#           sudo sed -i 's/fpdp.example.com/YOUR-DOMAIN/g' /etc/nginx/sites-available/fpdp
#           sudo ln -s /etc/nginx/sites-available/fpdp /etc/nginx/sites-enabled/fpdp
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (sudo certbot --nginx -d YOUR-DOMAIN) to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name fpdp.example.com;

    root /var/www/fpdp/public;
    index index.php;

    # Uploads (media, CV, digital products) are sent as base64 JSON, about
    # 4/3 of the file size: a 20 MB product file is a ~27 MB request.
    # Keep in line with post_max_size in deploy/ubuntu/php-fpdp.ini.
    client_max_body_size 32m;

    # WebFinger and other /.well-known endpoints are how other fediverse
    # servers find this node — they must reach PHP. This block has to come
    # before the dotfile rule below.
    location ^~ /.well-known/ {
        try_files $uri /index.php?$query_string;
    }

    # Every other dotfile (.env, .git, .htaccess) is never served.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Ubuntu keeps /run/php/php-fpm.sock pointing at the default PHP-FPM
        # version; use /run/php/php8.3-fpm.sock to pin a version instead.
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
