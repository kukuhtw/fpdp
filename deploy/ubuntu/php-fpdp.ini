; PHP settings for FPDP. Install for both PHP-FPM and the CLI (workers):
;   sudo cp deploy/ubuntu/php-fpdp.ini /etc/php/8.3/fpm/conf.d/99-fpdp.ini
;   sudo cp deploy/ubuntu/php-fpdp.ini /etc/php/8.3/cli/conf.d/99-fpdp.ini
;   sudo systemctl restart php8.3-fpm
; (replace 8.3 with your version: php -v)

; Uploads arrive as base64 JSON (~4/3 of the file size); the largest
; default limit is PRODUCT_ASSET_MAX_FILE_SIZE_BYTES = 20 MB.
post_max_size = 32M
upload_max_filesize = 32M
; Decoding a 20 MB upload holds the request body, the base64 string, and
; the decoded bytes in memory at the same time.
memory_limit = 256M

expose_php = Off
display_errors = Off
log_errors = On

session.cookie_secure = 1
session.cookie_httponly = 1
