services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      RUN_MIGRATIONS: "true"
      DISABLE_WEB_INSTALLER: "true"
    expose:
      - "80"
    volumes:
      - fpdp_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fpdp}
      MYSQL_USER: ${DB_USERNAME:-fpdp}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in Dokploy}
    volumes:
      - fpdp_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fpdp_storage:
  fpdp_mysql:
